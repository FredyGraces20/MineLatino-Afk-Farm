plugins { id 'net.fabricmc.fabric-loom' }

loom { mixin { defaultRefmapName = 'minelatino_afk_farm.refmap.json' } }
def mcVersion = project.findProperty('mcVersion') ?: '26.2'
def props = new Properties()
file('../versions.properties').withInputStream { props.load(it) }
def fabricLoader = props.getProperty("${mcVersion}.fabric.loader") ?: '0.19.5'
base.archivesName = "minelatino-afk-farm-fabric-${mcVersion}"

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation "net.fabricmc:fabric-loader:${fabricLoader}"
    if (project.hasProperty('cosmeticsDevJar')) runtimeOnly files(project.property('cosmeticsDevJar'))
}
sourceSets.main {
    java.srcDirs '../common/src/main/java', '../client-26.2/src/main/java'
    resources.srcDirs 'src/main/resources', '../client-26.2/src/main/resources'
}
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    inputs.property 'mcVersion', mcVersion
    inputs.property 'fabricLoader', fabricLoader
    inputs.property 'javaVersion', 25
    filesMatching('fabric.mod.json') {
        expand(version: project.version, mcVersion: mcVersion, fabricLoader: fabricLoader, javaVersion: 25)
    }
}
