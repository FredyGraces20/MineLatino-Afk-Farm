pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.fabricmc.fabric-loom') useVersion('1.17.20')
            if (requested.id.id == 'net.fabricmc.fabric-loom-remap') useVersion('1.17.20')
        }
    }
}
rootProject.name = 'minelatino-afk-farm'
include 'common', 'fabric'

def targetMinecraft = providers.gradleProperty('mcVersion').orElse('1.21.4').get()
if (targetMinecraft == '26.2') {
    project(':fabric').buildFileName = 'build-26.2.gradle'
}
