plugins { id 'net.fabricmc.fabric-loom-remap' }

loom { mixin { defaultRefmapName = 'minelatino_afk_farm.refmap.json' } }
def mcVersion = project.findProperty('mcVersion') ?: '1.21.4'
def props = new Properties()
file('../versions.properties').withInputStream { props.load(it) }
def fabricLoader = props.getProperty("${mcVersion}.fabric.loader") ?: '0.16.14'
base.archivesName = "minelatino-afk-farm-fabric-${mcVersion}"

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabricLoader}"
    if (project.hasProperty('cosmeticsDevJar')) modRuntimeOnly files(project.property('cosmeticsDevJar'))
}
sourceSets.main {
    java.srcDirs '../common/src/main/java', '../client/src/main/java',
        (mcVersion == '1.21.11' ? '../client-1.21.11/src/main/java' : '../client-1.21.4/src/main/java')
    resources.srcDirs 'src/main/resources',
        '../client/src/main/resources'
}
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    inputs.property 'mcVersion', mcVersion
    inputs.property 'fabricLoader', fabricLoader
    inputs.property 'javaVersion', 21
    filesMatching('fabric.mod.json') {
        expand(version: project.version, mcVersion: mcVersion, fabricLoader: fabricLoader, javaVersion: 21)
    }
}
