def targetMcVersion = project.findProperty('mcVersion') ?: '1.21.4'

allprojects {
    group = 'com.minelatino.afkfarm'
    version = '0.1.0-alpha.7'
    repositories { mavenCentral() }
}
subprojects {
    apply plugin: 'java'
    def externalBuildRoot = System.getenv('MINELATINO_AFK_BUILD_ROOT')
    layout.buildDirectory = externalBuildRoot
        ? file("${externalBuildRoot}/${targetMcVersion}/${project.name}")
        : rootProject.layout.projectDirectory.dir("build/${targetMcVersion}/${project.name}")
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
}
